<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>multi-select/set-option</title>
    <link
      rel="stylesheet"
      href="/node_modules/@vscode/codicons/dist/codicon.css"
      id="vscode-codicon-stylesheet"
    />
    <script type="module" src="/dev/demo.ts"></script>
    <script type="module" src="/src/vscode-multi-select/index.ts"></script>
    <script type="module" src="/src/vscode-option/index.ts"></script>
    <script>
      const logEvents = (selector, eventType) => {
        document.querySelector(selector).addEventListener(eventType, (ev) => {
          console.log(ev);
        });
      };
    </script>
  </head>

  <body>
    <h1>多选框</h1>
    <p>描述</p>
    <div id="size-demo-target">
      <vscode-multi-select id="my-select">
        <vscode-option value="A">A</vscode-option>
        <vscode-option value="B">B</vscode-option>
        <vscode-option value="C">C</vscode-option>
      </vscode-multi-select>
      <script type="module">
        // 等待页面准备就绪
        await new Promise((resolve) => setTimeout(resolve, 0));

        const select = document.getElementById('my-select');
        console.log(select.value); // 初始展示为空
        select.value = ['A', 'B', 'C']; // 填入所有值
        console.log(select.value); // 展示填入后的所有值
      </script>
      <div class="size-buttons">
        <button type="button" data-size="small">small</button>
        <button type="button" data-size="medium">medium</button>
        <button type="button" data-size="large">large</button>
      </div>
    </div>
    <script type="module">
      document.querySelectorAll('.size-buttons button').forEach((button) => {
        button.addEventListener('click', () => {
          document
            .querySelectorAll('#size-demo-target vscode-multi-select')
            .forEach((el) => {
              el.setAttribute('size', button.dataset.size);
            });
        });
      });
    </script>
  </body>
</html>
