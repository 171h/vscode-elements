<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'nonce-abc123'; script-src-elem 'nonce-abc123'; font-src 'self' data: 'nonce-abc123'; style-src-elem 'nonce-abc123'"
    />
    <title>icon/nonce</title>
    <link
      rel="stylesheet"
      href="/node_modules/@vscode/codicons/dist/codicon.css"
      id="vscode-codicon-stylesheet"
      nonce="abc123"
    />
    <script type="module" src="/dev/demo.ts" nonce="abc123"></script>
    <script nonce="abc123">
      window.litNonce = 'abc123';
      window.litNonce = 'abc123';
    </script>
    <script type="module" src="/src/main.ts" nonce="abc123"></script>
    <script nonce="abc123">
      const logEvents = (selector, eventType) => {
        document.querySelector(selector).addEventListener(eventType, (ev) => {
          console.log(ev);
        });
      };
    </script>
  </head>

  <body>
    <h1>使用 nonce 属性</h1>
    <main>
      <div id="size-demo-target">
        <vscode-icon name="account"></vscode-icon>
        <vscode-icon
          name="loading"
          size="32"
          spin
          spin-duration="3"
        ></vscode-icon>
        <vscode-button icon="account">Hello World</vscode-button>
        <vscode-button secondary>Hello World</vscode-button>
        <div class="size-buttons">
          <button type="button" data-size="small">small</button>
          <button type="button" data-size="medium">medium</button>
          <button type="button" data-size="large">large</button>
        </div>
      </div>
    </main>
    <script type="module" nonce="abc123">
      document.querySelectorAll('.size-buttons button').forEach((button) => {
        button.addEventListener('click', () => {
          document
            .querySelectorAll('#size-demo-target vscode-icon')
            .forEach((el) => {
              el.setAttribute('size', button.dataset.size);
            });
        });
      });
    </script>
  </body>
</html>
