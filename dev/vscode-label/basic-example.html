<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VSCode Elements</title>
    <link
      rel="stylesheet"
      href="/node_modules/@vscode/codicons/dist/codicon.css"
      id="vscode-codicon-stylesheet"
    />
    <script
      type="module"
      src="/node_modules/@vscode-elements/webview-playground/dist/index.js"
    ></script>
    <script type="module" src="/dist/main.js"></script>
    <script>
      const logEvents = (selector, eventType) => {
        document.querySelector(selector).addEventListener(eventType, (ev) => {
          console.log(ev);
        });
      };
    </script>
  </head>

  <body>
    <main>
      <vscode-demo>
        <vscode-form-group>
          <vscode-label for="textfield">Label example</vscode-label>
          <vscode-textfield id="textfield"></vscode-textfield
        ></vscode-form-group>
        <div>
          <button type="button" class="size-button" data-size="small">
            small
          </button>
          <button type="button" class="size-button" data-size="medium">
            medium
          </button>
          <button type="button" class="size-button" data-size="large">
            large
          </button>
        </div>
        <script type="module">
          document.querySelectorAll('.size-button').forEach((button) => {
            button.addEventListener('click', () => {
              document
                .querySelector('vscode-form-group')
                .setAttribute('size', button.dataset.size);
              document
                .querySelector('#textfield')
                .setAttribute('size', button.dataset.size);
            });
          });
        </script>
      </vscode-demo>
    </main>
  </body>
</html>
