<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'none';
        script-src 'nonce-abc123';
        script-src-elem 'nonce-abc123';
        font-src 'self' data: 'nonce-abc123';
        img-src data:;
        style-src 'nonce-abc123';
        style-src-elem 'nonce-abc123'"
    />
    <title>textarea/csp</title>
    <link
      rel="stylesheet"
      href="/node_modules/@vscode/codicons/dist/codicon.css"
      id="vscode-codicon-stylesheet"
      nonce="abc123"
    />
    <style nonce="abc123">
      vscode-scrollable {
        width: 200px;
        height: 200px;
      }

      vscode-scrollable div {
        z-index: 200;
      }
    </style>
    <script nonce="abc123">
      window.litNonce = 'abc123';
    </script>
    <script type="module" src="/dev/demo.ts" nonce="abc123"></script>
    <script type="module" src="/src/main.ts" nonce="abc123"></script>
    <script nonce="abc123">
      const logEvents = (selector, eventType) => {
        document.querySelector(selector).addEventListener(eventType, (ev) => {
          console.log(ev);
        });
      };
    </script>
  </head>

  <body>
    <h1>应用 CSP</h1>
    <main>
      <div id="size-demo-target">
        <vscode-textarea value="ffff" resize="vertical"></vscode-textarea>
        <div class="size-buttons">
          <button type="button" data-size="small">small</button>
          <button type="button" data-size="medium">medium</button>
          <button type="button" data-size="large">large</button>
        </div>
      </div>
    </main>
    <script type="module" nonce="abc123">
      document.querySelectorAll('.size-buttons button').forEach((button) => {
        button.addEventListener('click', () => {
          document
            .querySelectorAll('#size-demo-target vscode-textarea')
            .forEach((el) => {
              el.setAttribute('size', button.dataset.size);
            });
        });
      });
    </script>
  </body>
</html>
