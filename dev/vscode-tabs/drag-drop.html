<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>侧栏拖拽</title>
    <script type="module" src="/dev/demo.ts"></script>
    <script type="module" src="/src/main.ts"></script>
    <style>
      body {
        margin: 32px;
        background: var(--vscode-editor-background, Canvas);
        color: var(--vscode-foreground, CanvasText);
        font: var(--vscode-font-size, 13px)
          var(--vscode-font-family, sans-serif);
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr));
        gap: 32px;
      }
      vscode-tabs {
        min-width: 0;
        border: 1px solid
          var(--vscode-contrastBorder, var(--vscode-panel-border, currentColor));
      }
      vscode-tab-panel {
        min-height: 280px;
        padding: 8px;
      }
      fieldset {
        min-height: 90px;
      }
      label {
        display: block;
        margin: 12px 0;
      }
      input {
        background: var(--vscode-input-background, Canvas);
        color: var(--vscode-input-foreground, CanvasText);
        border: 1px solid
          var(
            --vscode-contrastBorder,
            var(--vscode-input-border, var(--vscode-panel-border, currentColor))
          );
        font: inherit;
      }
      input:focus-visible {
        outline: 1px solid var(--vscode-focusBorder, Highlight);
      }
      #events {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>侧栏拖拽</h1>
    <dev-theme-selector></dev-theme-selector>
    <p aria-label="Fieldset 尺寸">
      尺寸：
      <vscode-button data-fieldset-size="small">小</vscode-button>
      <vscode-button data-fieldset-size="medium">中</vscode-button>
      <vscode-button data-fieldset-size="large">大</vscode-button>
    </p>
    <p>
      拖拽标签页标题可排序，拖拽视图标题可移动视图。悬停在标签页中间可打开面板，在边缘放置可创建标签页。将标签页标题拖入另一面板可合并其视图。
    </p>
    <main>
      <vscode-tabs>
        <vscode-tab-header>资源管理器</vscode-tab-header>
        <vscode-tab-panel>
          <vscode-fieldset
            ><fieldset>
              <legend>文件</legend>
              <label>筛选 <input value="移动时保留此值" /></label></fieldset
          ></vscode-fieldset>
          <fieldset>
            <legend>大纲</legend>
            <p>类和函数大纲</p>
          </fieldset>
          <fieldset>
            <legend>时间线</legend>
            <p>最近编辑记录</p>
          </fieldset>
        </vscode-tab-panel>
        <vscode-tab-header>搜索</vscode-tab-header>
        <vscode-tab-panel
          ><fieldset>
            <legend>搜索结果</legend>
            <label>查询 <input /></label></fieldset
        ></vscode-tab-panel>
        <vscode-tab-header>空面板</vscode-tab-header>
        <vscode-tab-panel></vscode-tab-panel>
      </vscode-tabs>
      <vscode-tabs>
        <vscode-tab-header>辅助侧栏</vscode-tab-header>
        <vscode-tab-panel
          ><fieldset>
            <legend>笔记</legend>
            <p>将任一侧栏的视图拖到此处。</p>
          </fieldset></vscode-tab-panel
        >
      </vscode-tabs>
    </main>
    <p id="events" aria-live="polite">移动视图以查看布局事件。</p>
    <script>
      document.querySelectorAll('[data-fieldset-size]').forEach((button) => {
        button.addEventListener('click', () => {
          document
            .querySelectorAll('vscode-fieldset, vscode-tab-panel > fieldset')
            .forEach((fieldset) => {
              fieldset.setAttribute('size', button.dataset.fieldsetSize);
            });
        });
      });
      document.addEventListener('vsc-tabs-layout-change', (event) => {
        document.querySelector('#events').textContent =
          `已移动 ${event.detail.views.length} 个视图，可保存当前布局。`;
      });
    </script>
  </body>
</html>
