<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>标签页组拖拽</title>
    <script
      type="module"
      src="/node_modules/@vscode-elements/webview-playground/dist/index.js"
    ></script>
    <script type="module" src="/dist/main.js"></script>
    <style>
      body {
        margin: 32px;
        background: var(--vscode-editor-background, Canvas);
        color: var(--vscode-foreground, CanvasText);
        font: var(--vscode-font-size, 13px)
          var(--vscode-font-family, sans-serif);
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr));
        gap: 32px;
        align-items: start;
      }
      vscode-tabs-group {
        min-width: 0;
        padding: 8px;
        border: 1px solid
          var(--vscode-contrastBorder, var(--vscode-panel-border, currentColor));
      }
      vscode-tab-panel {
        min-height: 180px;
        padding: 8px;
      }
      fieldset {
        min-height: 72px;
      }
      label {
        display: block;
        margin: 12px 0;
      }
      input {
        background: var(--vscode-input-background, Canvas);
        color: var(--vscode-input-foreground, CanvasText);
        border: 1px solid
          var(
            --vscode-contrastBorder,
            var(--vscode-input-border, var(--vscode-panel-border, currentColor))
          );
        font: inherit;
      }
      input:focus-visible {
        outline: 1px solid var(--vscode-focusBorder, Highlight);
      }
      #events {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>标签页组拖拽</h1>
    <vscode-theme-selector></vscode-theme-selector>
    <p>
      拖拽标签栏空白背景可在容器之间移动整组。将标签页标题拖到容器可拆分为独立组，将
      fieldset 标题拖到容器可为该视图创建新组。空容器的虚线区域可接收拖拽内容。
    </p>
    <main>
      <vscode-tabs-group id="primary">
        <vscode-tabs>
          <vscode-tab-header>资源管理器</vscode-tab-header>
          <vscode-tab-panel>
            <vscode-fieldset
              ><fieldset>
                <legend>文件</legend>
                <label>筛选 <input value="移动时保留此值" /></label></fieldset
            ></vscode-fieldset>
            <fieldset>
              <legend>大纲</legend>
              <p>类和函数大纲</p>
            </fieldset>
          </vscode-tab-panel>
          <vscode-tab-header>搜索</vscode-tab-header>
          <vscode-tab-panel
            ><fieldset>
              <legend>搜索结果</legend>
              <label>查询 <input /></label></fieldset
          ></vscode-tab-panel>
        </vscode-tabs>
        <vscode-tabs>
          <vscode-tab-header>笔记</vscode-tab-header>
          <vscode-tab-panel
            ><fieldset>
              <legend>草稿</legend>
              <p>拖拽标签栏背景可调整此组的顺序。</p>
            </fieldset></vscode-tab-panel
          >
        </vscode-tabs>
      </vscode-tabs-group>
      <vscode-tabs-group id="secondary">
        <vscode-tabs>
          <vscode-tab-header>辅助侧栏</vscode-tab-header>
          <vscode-tab-panel
            ><fieldset>
              <legend>收件箱</legend>
              <p>将标签页、视图或整组拖到此处。</p>
            </fieldset></vscode-tab-panel
          >
        </vscode-tabs>
        <vscode-tabs>
          <vscode-tab-header>空面板</vscode-tab-header>
          <vscode-tab-panel></vscode-tab-panel>
        </vscode-tabs>
      </vscode-tabs-group>
    </main>
    <p id="events" aria-live="polite">移动组以查看布局事件。</p>
    <script>
      document.addEventListener('vsc-tabs-group-layout-change', (event) => {
        const {source, destination, tabs, header, views} = event.detail;
        document.querySelector('#events').textContent =
          `已将“${tabs.textContent.trim()}”从 ${source?.id || '容器外'} ` +
          `移动至 ${destination.id}；标题：${header ? `“${header.textContent.trim()}”` : '无'}，` +
          `视图数：${views.length}。`;
      });
      document.addEventListener('vsc-tabs-layout-change', (event) => {
        const {source, destination, views} = event.detail;
        document.querySelector('#events').textContent =
          `已移动 ${views.length} 个视图，可保存布局（目标${source === destination ? '相同' : '不同'}）。`;
      });
    </script>
  </body>
</html>
