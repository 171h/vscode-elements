<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>textfield/validation-min-validation</title>
    <link
      rel="stylesheet"
      href="/node_modules/@vscode/codicons/dist/codicon.css"
      id="vscode-codicon-stylesheet"
    />
    <script
      type="module"
      src="/node_modules/@vscode-elements/webview-playground/dist/index.js"
    ></script>
    <script type="module" src="/dist/vscode-icon/index.js"></script>
    <script type="module" src="/dist/vscode-label/index.js"></script>
    <script type="module" src="/dist/vscode-textfield/index.js"></script>
  </head>

  <body class="vscode-light">
    <main>
      <h1>Textfield</h1>
      <h2>Validation min validation</h2>
      <vscode-demo id="size-demo-target">
        <style>
          input[type='number']:invalid {
            background-color: rgba(255, 0, 0, 0.2);
          }
        </style>
        <vscode-label for="min-test">Min validation</vscode-label>
        <vscode-textfield
          id="min-test"
          name="min-test"
          min="10"
          type="number"
        ></vscode-textfield>
        <input type="number" min="10" id="min-test2" name="min-test2" />
        <div class="size-buttons">
          <button type="button" data-size="small">small</button>
          <button type="button" data-size="medium">medium</button>
          <button type="button" data-size="large">large</button>
        </div>
      </vscode-demo>
    </main>
    <script type="module">
      document.querySelectorAll('.size-buttons button').forEach((button) => {
        button.addEventListener('click', () => {
          document
            .querySelectorAll('#size-demo-target vscode-textfield')
            .forEach((el) => {
              el.setAttribute('size', button.dataset.size);
            });
        });
      });
    </script>
  </body>
</html>
