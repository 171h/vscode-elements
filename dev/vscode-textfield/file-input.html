<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>textfield/file-input</title>
    <link
      rel="stylesheet"
      href="/node_modules/@vscode/codicons/dist/codicon.css"
      id="vscode-codicon-stylesheet"
    />
    <script
      type="module"
      src="/node_modules/@vscode-elements/webview-playground/dist/index.js"
    ></script>
    <script type="module" src="/src/vscode-icon/index.ts"></script>
    <script type="module" src="/src/vscode-label/index.ts"></script>
    <script type="module" src="/src/vscode-textfield/index.ts"></script>
  </head>

  <body class="vscode-light">
    <main>
      <h1>文本框</h1>
      <h2>文件输入</h2>
      <vscode-demo id="size-demo-target">
        <vscode-label for="field-2">Lorem ipsum</vscode-label>
        <vscode-textfield
          id="field-2"
          autocomplete
          placeholder="占位文字……"
          type="file"
        >
        </vscode-textfield>
        <div class="size-buttons">
          <button type="button" data-size="small">small</button>
          <button type="button" data-size="medium">medium</button>
          <button type="button" data-size="large">large</button>
        </div>
      </vscode-demo>
    </main>
    <script type="module">
      document.querySelectorAll('.size-buttons button').forEach((button) => {
        button.addEventListener('click', () => {
          document
            .querySelectorAll('#size-demo-target vscode-textfield')
            .forEach((el) => {
              el.setAttribute('size', button.dataset.size);
            });
        });
      });
    </script>
  </body>
</html>
