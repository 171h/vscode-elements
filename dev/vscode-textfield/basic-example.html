<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>textfield/basic-example</title>
    <link
      rel="stylesheet"
      href="/node_modules/@vscode/codicons/dist/codicon.css"
      id="vscode-codicon-stylesheet"
    />
    <script
      type="module"
      src="/node_modules/@vscode-elements/webview-playground/dist/index.js"
    ></script>
    <script type="module" src="/src/vscode-icon/index.ts"></script>
    <script type="module" src="/src/vscode-label/index.ts"></script>
    <script type="module" src="/src/vscode-textfield/index.ts"></script>
  </head>

  <body class="vscode-light">
    <main>
      <h1>文本框</h1>
      <h2>基础示例</h2>
      <vscode-demo id="size-demo-target">
        <vscode-label for="field-1">Lorem ipsum</vscode-label>
        <vscode-textfield id="field-1" autocomplete placeholder="占位文字……">
          <vscode-icon name="calendar" slot="content-before"></vscode-icon>
          <vscode-icon
            id="search-icon"
            name="search"
            slot="content-after"
            action-icon
            label="搜索"
          ></vscode-icon>
        </vscode-textfield>
        <button type="button" id="bt-focus">focus</button>
        <script type="module">
          const el = document.getElementById('field-1');
          const icon = document.getElementById('search-icon');

          document.addEventListener('invalid', (ev) => {
            console.log(ev);
          });
          document.addEventListener('input', (ev) => {
            console.log(ev);
          });
          el.addEventListener('change', (ev) => {
            console.log(ev);
          });
          el.addEventListener('select', (ev) => {
            console.log(ev);
          });
          el.addEventListener('invalid', (ev) => {
            console.log(ev);
          });
          icon.addEventListener('click', (ev) => {
            console.log(ev);
          });
          el.addEventListener('focus', (ev) => {
            console.log(ev);
          });
          el.addEventListener('blur', (ev) => {
            console.log(ev);
          });
          document.getElementById('bt-focus').addEventListener('click', () => {
            document.getElementById('field-1').focus();
          });
        </script>
        <div class="size-buttons">
          <button type="button" data-size="small">small</button>
          <button type="button" data-size="medium">medium</button>
          <button type="button" data-size="large">large</button>
        </div>
        <div class="icon-size-buttons">
          Icon size:
          <button type="button" data-icon-size="small">small</button>
          <button type="button" data-icon-size="medium">medium</button>
          <button type="button" data-icon-size="large">large</button>
        </div>
      </vscode-demo>
    </main>
    <script type="module">
      document.querySelectorAll('.size-buttons button').forEach((button) => {
        button.addEventListener('click', () => {
          document
            .querySelectorAll('#size-demo-target vscode-textfield')
            .forEach((el) => {
              el.setAttribute('size', button.dataset.size);
            });
        });
      });
    </script>
    <script type="module">
      document
        .querySelectorAll('.icon-size-buttons button')
        .forEach((button) => {
          button.addEventListener('click', () => {
            button
              .closest('vscode-demo')
              .querySelectorAll('vscode-icon')
              .forEach((icon) => {
                icon.setAttribute('size', button.dataset.iconSize);
              });
          });
        });
    </script>
  </body>
</html>
