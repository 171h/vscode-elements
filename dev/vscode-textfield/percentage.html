<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>textfield/percentage</title>
    <link
      rel="stylesheet"
      href="/node_modules/@vscode/codicons/dist/codicon.css"
      id="vscode-codicon-stylesheet"
    />
    <script
      type="module"
      src="/node_modules/@vscode-elements/webview-playground/dist/index.js"
    ></script>
    <script type="module" src="/src/vscode-icon/index.ts"></script>
    <script type="module" src="/src/vscode-label/index.ts"></script>
    <script type="module" src="/src/vscode-textfield/index.ts"></script>
  </head>

  <body>
    <h1>文本框</h1>
    <h2>百分比模式</h2>
    <vscode-demo id="size-demo-target">
      <vscode-label for="opacity">Opacity</vscode-label>
      <vscode-textfield
        id="opacity"
        percentage
        name="opacity"
        value="0.5"
      ></vscode-textfield>
      <p>
        输入文字：<span id="typed-text">50%</span> &nbsp; 程序读取值：<span
          id="program-value"
          >0.5</span
        >
      </p>

      <h3>编辑</h3>
      <p>
        百分号作为显示遮罩：数字包含一位数字时即显示。失去焦点时，<code
          >05</code
        >
        变为 <code>5%</code>；输入逗号会转换为句点。
      </p>
      <vscode-label for="zoom">Zoom (required)</vscode-label>
      <vscode-textfield
        id="zoom"
        percentage
        required
        placeholder="输入数字"
      ></vscode-textfield>

      <h3>校验</h3>
      <p>
        <code>min</code>、<code>max</code> 和
        <code>step</code> 使用小数形式，因此 <code>min="0" max="1"</code> 接受
        0% 至 100%，<code>step="0.05"</code> 表示 5% 步长。
      </p>
      <vscode-textfield
        id="ratio"
        percentage
        min="0"
        max="1"
        step="0.05"
        value="0.5"
      ></vscode-textfield>
      <p>
        有效：<span id="ratio-valid">true</span> &nbsp;
        <button type="button" id="ratio-check">checkValidity()</button>
      </p>

      <h3>运行时切换模式</h3>
      <vscode-textfield id="toggle" value="0.25"></vscode-textfield>
      <button type="button" id="toggle-button">Enable percentage mode</button>

      <h3>参与表单</h3>
      <form action="#" id="percentage-form">
        <vscode-textfield
          percentage
          name="scale"
          value="0.75"
        ></vscode-textfield>
        <vscode-textfield
          percentage
          name="offset"
          value="-0.1"
        ></vscode-textfield>
        <button type="submit">Submit</button>
      </form>
      <p>提交条目：<span id="form-data">-</span></p>

      <div class="size-buttons">
        <button type="button" data-size="small">small</button>
        <button type="button" data-size="medium">medium</button>
        <button type="button" data-size="large">large</button>
      </div>
    </vscode-demo>

    <script type="module">
      const opacity = document.querySelector('#opacity');
      const typedText = document.querySelector('#typed-text');
      const programValue = document.querySelector('#program-value');

      const showValue = () => {
        typedText.textContent = opacity.wrappedElement.value;
        programValue.textContent = opacity.value;
      };

      opacity.addEventListener('input', showValue);
      opacity.addEventListener('change', showValue);
      showValue();

      const ratio = document.querySelector('#ratio');
      const ratioValid = document.querySelector('#ratio-valid');

      document.querySelector('#ratio-check').addEventListener('click', () => {
        ratioValid.textContent = ratio.checkValidity();
        ratio.invalid = !ratio.checkValidity();
      });

      const toggle = document.querySelector('#toggle');
      const toggleButton = document.querySelector('#toggle-button');

      toggleButton.addEventListener('click', () => {
        toggle.percentage = !toggle.percentage;
        toggleButton.textContent = toggle.percentage
          ? 'Disable percentage mode'
          : 'Enable percentage mode';
      });

      const form = document.querySelector('#percentage-form');
      const formData = document.querySelector('#form-data');

      form.addEventListener('submit', (ev) => {
        ev.preventDefault();
        const entries = [...new FormData(form)].map(
          ([key, value]) => `${key}=${value}`
        );

        formData.textContent = entries.join(', ');
      });
    </script>

    <script type="module">
      document.querySelectorAll('.size-buttons button').forEach((button) => {
        button.addEventListener('click', () => {
          document
            .querySelectorAll('#size-demo-target vscode-textfield')
            .forEach((el) => {
              el.setAttribute('size', button.dataset.size);
            });
        });
      });
    </script>
  </body>
</html>
