<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>button/basic-examples</title>
    <link
      rel="stylesheet"
      href="/node_modules/@vscode/codicons/dist/codicon.css"
      id="vscode-codicon-stylesheet"
    />
    <script type="module" src="/dev/demo.ts"></script>
    <script type="module" src="/src/main.ts"></script>
    <script>
      const logEvents = (selector, eventType) => {
        document.querySelector(selector).addEventListener(eventType, (ev) => {
          console.log(ev);
        });
      };
    </script>
  </head>

  <body>
    <main>
      <div id="size-demo-target">
        <div>
          <vscode-button>Primary Button</vscode-button>
          <vscode-button secondary>Secondary Button</vscode-button>
          <div class="size-buttons">
            <button type="button" data-size="small">small</button>
            <button type="button" data-size="medium">medium</button>
            <button type="button" data-size="large">large</button>
          </div>
        </div>
      </div>
    </main>
    <script type="module">
      document.querySelectorAll('.size-buttons button').forEach((button) => {
        button.addEventListener('click', () => {
          document
            .querySelectorAll('#size-demo-target vscode-button')
            .forEach((el) => {
              el.setAttribute('size', button.dataset.size);
            });
        });
      });
    </script>
  </body>
</html>
