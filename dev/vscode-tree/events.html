    <script type="module">
      document
        .querySelectorAll('.icon-size-buttons button')
        .forEach((button) => {
          button.addEventListener('click', () => {
            button
              .closest('div')
              .querySelectorAll('vscode-icon')
              .forEach((icon) => {
                icon.setAttribute('size', button.dataset.iconSize);
              });
          });
        });
