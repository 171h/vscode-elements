<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>checkbox/toggle</title>
    <script type="module" src="/dev/demo.ts"></script>
    <script src="/src/vscode-checkbox/index.ts" type="module"></script>
  </head>

  <body>
    <main>
      <h2>切换开关模式</h2>
      <div id="size-demo-target">
        <vscode-checkbox
          toggle
          label="开关（关闭）"
          id="toggle-off"
        ></vscode-checkbox>
        <vscode-checkbox
          toggle
          label="开关（开启）"
          checked
          id="toggle-on"
        ></vscode-checkbox>
        <vscode-checkbox
          toggle
          label="开关（禁用）"
          disabled
          id="toggle-disabled"
        ></vscode-checkbox>
        <vscode-checkbox
          toggle
          label="开关（必填）"
          required
          id="toggle-required"
        ></vscode-checkbox>

        <script type="module">
          const log = (selector, type) => {
            document.querySelector(selector)?.addEventListener(type, (ev) => {
              console.log(`[${selector}] ${type}`, {
                checked: ev.currentTarget.checked,
              });
            });
          };

          [
            '#toggle-off',
            '#toggle-on',
            '#toggle-disabled',
            '#toggle-required',
          ].forEach((sel) => {
            log(sel, 'change');
            log(sel, 'invalid');
          });
        </script>
        <div class="size-buttons">
          <button type="button" data-size="small">small</button>
          <button type="button" data-size="medium">medium</button>
          <button type="button" data-size="large">large</button>
        </div>
      </div>
    </main>
    <script type="module">
      document.querySelectorAll('.size-buttons button').forEach((button) => {
        button.addEventListener('click', () => {
          document
            .querySelectorAll('#size-demo-target vscode-checkbox')
            .forEach((el) => {
              el.setAttribute('size', button.dataset.size);
            });
        });
      });
    </script>
  </body>
</html>
