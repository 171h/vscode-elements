<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>checkbox/validate-checked</title>
    <script
      type="module"
      src="/node_modules/@vscode-elements/webview-playground/dist/index.js"
    ></script>
    <script src="/dist/vscode-checkbox/index.js" type="module"></script>
  </head>

  <body>
    <main>
      <vscode-demo id="size-demo-target">
        <style>
          input[type='checkbox']:invalid {
            outline: 2px solid red;
            outline-offset: 2px;
          }
        </style>
        <vscode-checkbox
          label="Checkbox example"
          value="testvalue1"
          required
        ></vscode-checkbox>
        <vscode-checkbox
          label="Checkbox example"
          value="testvalue1"
          checked
          required
        ></vscode-checkbox>
        <input type="checkbox" required />
        <input type="checkbox" required checked />
        <div class="size-buttons">
          <button type="button" data-size="small">small</button>
          <button type="button" data-size="medium">medium</button>
          <button type="button" data-size="large">large</button>
        </div>
      </vscode-demo>
    </main>
    <script type="module">
      document.querySelectorAll('.size-buttons button').forEach((button) => {
        button.addEventListener('click', () => {
          document
            .querySelectorAll('#size-demo-target vscode-checkbox')
            .forEach((el) => {
              el.setAttribute('size', button.dataset.size);
            });
        });
      });
    </script>
  </body>
</html>
