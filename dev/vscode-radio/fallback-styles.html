<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VSCode Elements</title>
    <link
      rel="stylesheet"
      href="/node_modules/@vscode/codicons/dist/codicon.css"
      id="vscode-codicon-stylesheet"
    />
    <script type="module" src="/dist/main.js"></script>
    <script>
      const logEvents = (selector, eventType) => {
        document.querySelector(selector).addEventListener(eventType, (ev) => {
          console.log(ev);
        });
      };
    </script>
  </head>

  <body style="background-color: #1f1f1f">
    <h1>%%TITLE%%</h1>
    <main>
      <div id="size-demo-target">
        <vscode-radio-group>
          <vscode-radio name="radio" required>Lorem</vscode-radio>
          <vscode-radio name="radio">Ipsum</vscode-radio>
        </vscode-radio-group>
      </div>
      <div class="size-buttons">
        <button type="button" data-size="small">small</button>
        <button type="button" data-size="medium">medium</button>
        <button type="button" data-size="large">large</button>
      </div>
    </main>
    <script type="module">
      document.querySelectorAll('.size-buttons button').forEach((button) => {
        button.addEventListener('click', () => {
          document
            .querySelectorAll('#size-demo-target vscode-radio')
            .forEach((el) => {
              el.setAttribute('size', button.dataset.size);
            });
        });
      });
    </script>
  </body>
</html>
