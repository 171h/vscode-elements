<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>toolbar-button/change-event</title>
    <link
      rel="stylesheet"
      href="/node_modules/@vscode/codicons/dist/codicon.css"
      id="vscode-codicon-stylesheet"
    />
    <script type="module" src="/dev/demo.ts"></script>
    <script type="module" src="/src/main.ts"></script>
    <script>
      const logEvents = (selector, eventType) => {
        document.querySelector(selector).addEventListener(eventType, (ev) => {
          console.log(ev);
        });
      };
    </script>
  </head>

  <body>
    <main>
      <div>
        <vscode-toolbar-container>
          <vscode-toolbar-button
            icon="layout"
            label="布局"
            toggleable
          ></vscode-toolbar-button>
        </vscode-toolbar-container>
        <script>
          const el = document.querySelector('vscode-toolbar-button');
          el.addEventListener('change', () => {
            console.log(el.checked);
          });
        </script>
      </div>
    </main>
  </body>
</html>
