<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>single-select/select-mode/dispatch-invalid-event</title>
    <link
      rel="stylesheet"
      href="/node_modules/@vscode/codicons/dist/codicon.css"
      id="vscode-codicon-stylesheet"
    />
    <script
      type="module"
      src="/node_modules/@vscode-elements/webview-playground/dist/index.js"
    ></script>
    <script type="module" src="/dist/vscode-single-select/index.js"></script>
    <script type="module" src="/dist/vscode-option/index.js"></script>
  </head>

  <body>
    <h1>Single Select</h1>
    <h2>Dispatch "invalid" event</h2>
    <vscode-demo id="size-demo-target">
      <form action="#">
        <p>
          <vscode-single-select required name="select-1" id="select-1">
            <vscode-option></vscode-option>
            <vscode-option>Lorem</vscode-option>
            <vscode-option>Ipsum</vscode-option>
            <vscode-option>Dolor</vscode-option>
          </vscode-single-select>
        </p>
        <button type="submit">Submit</button>
      </form>
      <script type="module">
        const s = document.querySelector('#select-1');

        s.addEventListener('invalid', (ev) => {
          console.log(ev);
        });
      </script>
      <div class="size-buttons">
        <button type="button" data-size="small">small</button>
        <button type="button" data-size="medium">medium</button>
        <button type="button" data-size="large">large</button>
      </div>
    </vscode-demo>
    <script type="module">
      document.querySelectorAll('.size-buttons button').forEach((button) => {
        button.addEventListener('click', () => {
          document
            .querySelectorAll('#size-demo-target vscode-single-select')
            .forEach((el) => {
              el.setAttribute('size', button.dataset.size);
            });
        });
      });
    </script>
  </body>
</html>
