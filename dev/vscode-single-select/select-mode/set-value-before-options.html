<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>single-select/select-mode/set-value-before-options</title>
    <link
      rel="stylesheet"
      href="/node_modules/@vscode/codicons/dist/codicon.css"
      id="vscode-codicon-stylesheet"
    />
    <script type="module" src="/dev/demo.ts"></script>
    <script type="module" src="/src/vscode-single-select/index.ts"></script>
    <script type="module" src="/src/vscode-option/index.ts"></script>
    <script>
      const logEvents = (selector, eventType) => {
        document.querySelector(selector).addEventListener(eventType, (ev) => {
          console.log(ev);
        });
      };
    </script>
  </head>

  <body>
    <h1>选择框</h1>
    <div id="size-demo-target">
      <vscode-single-select id="select"></vscode-single-select>
      <div class="size-buttons">
        <button type="button" data-size="small">small</button>
        <button type="button" data-size="medium">medium</button>
        <button type="button" data-size="large">large</button>
      </div>
    </div>
    <script type="module">
      const select = document.querySelector('vscode-single-select');
      select.value = 'dolor';

      const op1 = document.createElement('vscode-option');
      const op2 = document.createElement('vscode-option');
      const op3 = document.createElement('vscode-option');

      op1.innerHTML = 'lorem';
      op2.innerHTML = 'ipsum';
      op3.innerHTML = 'dolor';

      select.appendChild(op1);
      select.appendChild(op2);
      select.appendChild(op3);
    </script>
    <script type="module">
      document.querySelectorAll('.size-buttons button').forEach((button) => {
        button.addEventListener('click', () => {
          document
            .querySelectorAll('#size-demo-target vscode-single-select')
            .forEach((el) => {
              el.setAttribute('size', button.dataset.size);
            });
        });
      });
    </script>
  </body>
</html>
