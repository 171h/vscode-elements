<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>single-select/combobox-mode/deleting-value</title>
    <link
      rel="stylesheet"
      href="/node_modules/@vscode/codicons/dist/codicon.css"
      id="vscode-codicon-stylesheet"
    />
    <script type="module" src="/dev/demo.ts"></script>
    <script type="module" src="/src/main.ts"></script>
    <script>
      const logEvents = (selector, eventType) => {
        document.querySelector(selector).addEventListener(eventType, (ev) => {
          console.log(ev);
        });
      };
    </script>
  </head>

  <body>
    <main>
      <form action="#">
        <div id="size-demo-target">
          <vscode-single-select name="fruit" id="select" combobox required>
            <vscode-option value="banana">Banana</vscode-option>
            <vscode-option value="cherry">Cherry</vscode-option>
            <vscode-option value="apple">Apple</vscode-option>
            <vscode-option value="strawberry">Strawberry</vscode-option>
            <vscode-option value="lemon">Lemon</vscode-option>
            <vscode-option value="orange">Orange</vscode-option>
          </vscode-single-select>
          <p>
            <select name="fruit" id="native-select" required>
              <option value="banana">Banana</option>
              <option value="cherry">Cherry</option>
              <option value="apple">Apple</option>
              <option value="strawberry">Strawberry</option>
              <option value="lemon">Lemon</option>
              <option value="orange">Orange</option>
            </select>
          </p>
          <script type="module">
            logEvents('#select', 'change');
            logEvents('#select', 'input');
            logEvents('#native-select', 'change');
            logEvents('#native-select', 'input');
          </script>
          <div class="size-buttons">
            <button type="button" data-size="small">small</button>
            <button type="button" data-size="medium">medium</button>
            <button type="button" data-size="large">large</button>
          </div>
        </div>
      </form>
    </main>
    <script type="module">
      document.querySelectorAll('.size-buttons button').forEach((button) => {
        button.addEventListener('click', () => {
          document
            .querySelectorAll('#size-demo-target vscode-single-select')
            .forEach((el) => {
              el.setAttribute('size', button.dataset.size);
            });
        });
      });
    </script>
  </body>
</html>
