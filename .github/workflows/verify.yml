name: Verify PR

on: pull_request

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 安装浏览器
        run: pnpm test:install

      - name: Transpile files
        run: pnpm build

      - name: 检查类型
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm prettier

      - name: 验证文档示例
        run: pnpm docs:test

      - name: 验证组件包产物
        run: pnpm test:build

      - name: Test
        run: pnpm test
