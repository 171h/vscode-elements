name: Release

# `npm run release` creates and pushes this tag after updating the version and
# CHANGELOG. Building and publishing happen only in GitHub Actions.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Verify release version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Test release scripts
        run: npm run test:release

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run prettier

      - name: Pack package
        run: npm pack

      - name: Publish to npmjs
        shell: bash
        run: |
          if npm view "nusys-ui@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "nusys-ui@${PACKAGE_VERSION} is already published; skipping npm publish."
          else
            npm publish "nusys-ui-${PACKAGE_VERSION}.tgz" --access=public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ORG_NPM_TOKEN }}

      - name: Extract release notes
        run: node scripts/extract-release-notes.mjs "$PACKAGE_VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "nusys-ui-${PACKAGE_VERSION}.tgz"
          --title "$GITHUB_REF_NAME"
          --notes-file dist/release-notes.md
